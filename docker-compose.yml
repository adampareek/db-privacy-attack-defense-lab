services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securitylab
      POSTGRES_USER: labadmin
      POSTGRES_PASSWORD: labadmin-demo-only
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labadmin -d securitylab"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://labadmin:labadmin-demo-only@db:5432/securitylab
      SESSION_TTL_SECONDS: "3600"
      MIN_COHORT_SIZE: "5"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
